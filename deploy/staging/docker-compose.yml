name: gupmax-staging

services:
  edge:
    image: caddy:2.10.2-alpine
    env_file:
      - path: .env.staging
        required: false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - edge
      - app

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file:
      - path: .env.staging
        required: false
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
      - data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.release
      args:
        API_BASE_URL: ${API_BASE_URL}
    expose:
      - "80"
    networks:
      - app

  postgres:
    image: postgres:17.6-alpine
    env_file:
      - path: .env.staging
        required: false
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2.1-alpine
    env_file:
      - path: .env.staging
        required: false
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:

networks:
  edge:
  app:
    internal: true
  data:
    internal: true
