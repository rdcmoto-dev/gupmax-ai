[project]
name = "gupmax-ai-api"
version = "0.1.0"
description = "GUPMAX AI API"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16,<2.0",
    "asyncpg>=0.30,<1.0",
    "email-validator>=2.2,<3.0",
    "fastapi>=0.141,<1.0",
    "httpx>=0.28,<1.0",
    "openai>=2.26,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "pwdlib[argon2]>=0.3,<1.0",
    "PyJWT>=2.10,<3.0",
    "redis>=6.4,<7.0",
    "sqlalchemy[asyncio]>=2.0.43,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21,<1.0",
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.1,<2.0",
    "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
